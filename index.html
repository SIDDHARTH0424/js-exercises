<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Exercises</title>
</head>
<body>
  <h1>DOM Exercises</h1>

  <h2>8. Click counter</h2>
  <button id="counterBtn">Clicked 0 times</button>

  <h2>9. To-do list</h2>

  <textarea id="textBox" rows="3" cols="30"></textarea>
  <p id="charCount">0 characters</p>

  <script src="dom.js"></script>
